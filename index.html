<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Matos</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wdth,wght@0,75..100,100..900;1,75..100,100..900&display=swap"

<body>

    <header>
        <div class="container">
            <div class="logo">
                <a href="#Inicio"><img src="assets/images/logo.png" alt=""></a>
            </div>
        </div>
        <div class="menu">
            <nav>
                <div class="menuMobile">
                    <div class="menu-mobile"></div>
                    <div class="menu-mobile"></div>
                    <div class="menu-mobile"></div>
                </div>
                <ul>
                    <li class="active"><a href="#">Início</a></li>
                    <li><a href="#">Acomodações</a></li>
                    <li><a href="#">Valores</a></li>
                    <li><a href="#">Contato</a></li>
                    <li><a href="#">Localização</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="banner">
        <div class="container column">
            <div class="banner-headline">
                <h1>Sua melhor escolha no litoral gaúcho!</h1>
            </div>
            <div class="banner-options">
                <div class="banner1">
                    <div class="banner-card"><img src="assets/images/card-abertura.png" alt=""></div>
                    <div class="banner-desc">Abertos 24 H</div>
                </div>
                <div class="banner2">
                    <div class="banner-card"><img src="assets/images/card-praia.png" alt=""></div>
                    <div class="banner-desc">400 M da Praia</div>
                </div>
                <div class="banner3">
                    <div class="banner-card"><img src="assets/images/card-shopping.png" alt=""></div>
                    <div class="banner-desc">1.3 km do Centro</div>
                </div>
                <div class="banner4">
                    <div class="banner-card"><img src="assets/images/card-estacionamento.png" alt=""></div>
                    <div class="banner-desc">Estacionamento privado</div>
                </div>
            </div>
        </div>
    </section>

</html>
